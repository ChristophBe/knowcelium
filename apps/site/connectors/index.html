<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connectors: Knowcelium</title>
    <meta name="description" content="Connectors give Knowcelium access to the systems that hold your knowledge, by syncing them or searching them live. Learn the concept and see the two example connectors from the demo." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Connectors: Knowcelium" />
    <meta
      property="og:description"
      content="Connect your organization's documents and systems, search them by meaning and get answers with sources. Open source, on your own infrastructure."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f4f4f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11120f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applies the saved theme (@knowcel/ui theme.ts) before first paint, so a pinned theme doesn't flash.
      try {
        // Reads the pre-rename "kb.theme" key as a fallback; @knowcel/ui migrates it on first load.
        const theme = localStorage.getItem("knowcel.theme") ?? localStorage.getItem("kb.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body class="bg-canvas text-fg antialiased">
    <div id="root"><!--app--></div>
    <script type="module" src="/src/entry-client.tsx" data-page="connectors"></script>
  </body>
</html>
