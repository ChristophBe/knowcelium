openapi: 3.0.3
info:
  title: Knowcelium connector contract
  version: 1.0.0
  description: |
    What a connector service implements so that Knowcelium can sync it into
    documents and search it at question time (docs/adr/0017-connectors-are-services.md,
    docs/connectors.md). A connector is a small web service, deployed on its own.
    It registers with Knowcelium or an administrator adds it by URL.

    Knowcelium calls the service with `Authorization: Bearer <secret>`, the
    secret it issued when the service was approved. The settings of one
    connector instance (a URL, a token for the source system) travel in the body
    of each request, so one service can host many instances and keeps no
    state about them. Settings are sent only over https unless an administrator
    allowed http for that service.

    The contract is versioned by its path. Additions that older clients can
    ignore (new optional fields, new endpoints, new capabilities) stay in v1; a
    break is a new /v2 that the service announces next to /v1 in `contract_versions`.
servers:
  - url: http://localhost:8080
    description: A connector service, as Knowcelium reaches it.
security:
  - bearerAuth: []
tags:
  - name: discovery
  - name: sync
  - name: search

paths:
  /v1/info:
    get:
      tags: [discovery]
      operationId: getInfo
      summary: What the service is and what its connectors can do.
      description: |
        Called when the service registers or is added, and again before an
        instance is configured. The `settings_schema` drives the form an
        administrator fills in.
      responses:
        "200":
          description: The service's description.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/validate:
    post:
      tags: [discovery]
      operationId: validateSettings
      summary: Check the settings of an instance, and that the source can be reached with them.
      description: |
        Always answers 200 with `valid` and the problems, so that a problem is
        data the administrator can act on and not an error of the call. Nothing
        is stored by either side.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateRequest" }
      responses:
        "200":
          description: The outcome of the check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/changes:
    post:
      tags: [sync]
      operationId: listChanges
      summary: One page of the items of the source that changed.
      description: |
        The first request of a run sends no `cursor`; the next ones send the
        `next_cursor` of the previous page until it is absent. `since` is the
        start of the last successful sync (absent for the first). The service
        may list more than changed: Knowcelium compares `version` and content
        and skips what is unchanged.

        A connector that is `complete` lists every item that exists, whatever
        `since` says, and Knowcelium deletes the documents of items it did not
        see, but only after a run that did not fail and never when the listing
        is empty while documents exist. Any other connector reports removals as
        records with `deleted` set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangesRequest" }
      responses:
        "200":
          description: A page of records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConnectorProblem" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/content:
    post:
      tags: [sync]
      operationId: readContent
      summary: The content of one item that `/v1/changes` listed without `data`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentRequest" }
      responses:
        "200":
          description: The bytes of the item's file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The item no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ConnectorProblem" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/search:
    post:
      tags: [search]
      operationId: search
      summary: Passages of the source that match a question, at question time.
      description: |
        Only for a service whose `capabilities` include `search`. The `query` is
        the question as the user typed it; the service turns it into what its
        source understands. It does not learn who is asking: everyone who may
        read the instance gets what is returned, so a service returns only what
        all of them may see. Be quick: Knowcelium stops waiting after its
        timeout (5 seconds by default) and tells the user the connector was
        unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Up to `limit` snippets, best first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConnectorProblem" }
        "501":
          description: The service does not support search.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The secret Knowcelium issued to the service when it was approved.

  responses:
    Unauthorized:
      description: The bearer secret is missing or wrong.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ConnectorProblem:
      description: |
        A problem an administrator can fix (a wrong token, an unreachable
        source system, invalid settings). `message` names the setting to fix. The
        run fails without deleting anything.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: |
        The service cannot answer now (overloaded, shutting down). Knowcelium
        retries at the next interval and treats the connector as unavailable
        for a live search.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Info:
      type: object
      required: [kind, title, contract_versions, capabilities, complete, settings_schema]
      properties:
        kind:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
          description: Names the type of source, for example `mcp`. Unique among registered services.
        title:
          type: string
          description: A human-readable name for the Connectors page.
        description:
          type: string
        version:
          type: string
          description: The service's own version, shown to administrators.
        contract_versions:
          type: array
          minItems: 1
          items: { type: string, example: v1 }
          description: The contract versions the service implements; Knowcelium uses the newest it knows.
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
          description: What instances can do. A service that lists no `sync` or `search` does nothing.
        complete:
          type: boolean
          description: |
            True when `/v1/changes` always lists every item that exists, so
            Knowcelium deletes the documents of items it did not see. The safe
            default is false: report removals as records with `deleted`.
        settings_schema:
          type: object
          additionalProperties: true
          description: |
            A JSON Schema (draft 2020-12, flat properties of strings, numbers,
            booleans and string maps) for the settings of an instance. A property
            with `writeOnly: true` is a secret: Knowcelium stores it encrypted,
            never returns it and shows a write-only field.

    Capability:
      type: string
      enum: [sync, search]

    ValidateRequest:
      type: object
      required: [settings]
      properties:
        settings: { $ref: "#/components/schemas/Settings" }

    ValidateResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        problems:
          type: array
          items: { $ref: "#/components/schemas/SettingProblem" }

    SettingProblem:
      type: object
      required: [message]
      properties:
        setting:
          type: string
          description: The setting to fix; empty for a problem of the instance as a whole.
        message:
          type: string
          description: What the administrator reads.

    Settings:
      type: object
      additionalProperties: true
      description: The settings of one instance, as `settings_schema` describes them, secrets included.

    ChangesRequest:
      type: object
      required: [settings]
      properties:
        settings: { $ref: "#/components/schemas/Settings" }
        since:
          type: string
          format: date-time
          nullable: true
          description: The start of the last successful sync; null or absent for the first.
        cursor:
          type: string
          description: The `next_cursor` of the previous page; absent for the first page.

    ChangesResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/Record" }
        next_cursor:
          type: string
          description: Present while more pages follow. A page must make progress, so an empty page with a cursor is an error.

    Record:
      type: object
      required: [external_id]
      properties:
        external_id:
          type: string
          description: Identifies the item within the instance and never changes, so a rename or an edit updates its document instead of adding one.
        filename:
          type: string
          description: The file the document is made of; its extension decides how the text is read (.md, .txt, .html, .pdf, .docx).
        title: { type: string }
        content_type: { type: string }
        source_url:
          type: string
          description: Where people open the original. Only http and https addresses are followed.
        metadata:
          type: object
          additionalProperties: { type: string }
        version:
          type: string
          description: A cheap fingerprint of the item (a modification time, an etag). While it is unchanged, Knowcelium does not read the content again.
        deleted:
          type: boolean
          description: The item no longer exists; its document is deleted.
        data:
          type: string
          format: byte
          description: The content, base64-encoded. Absent for a larger or unchanged item, which Knowcelium then reads with `/v1/content` when it needs it.

    ContentRequest:
      type: object
      required: [settings, external_id]
      properties:
        settings: { $ref: "#/components/schemas/Settings" }
        external_id: { type: string }

    SearchRequest:
      type: object
      required: [settings, query, limit]
      properties:
        settings: { $ref: "#/components/schemas/Settings" }
        query: { type: string }
        limit:
          type: integer
          minimum: 1
          maximum: 20

    SearchResponse:
      type: object
      required: [snippets]
      properties:
        snippets:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Snippet" }

    Snippet:
      type: object
      required: [text, source_url]
      properties:
        text: { type: string }
        source_url:
          type: string
          description: Where to open the original; shown as the citation. Only http and https addresses are followed.
        title: { type: string }
        external_id: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: A short machine-readable reason, for example `invalid_settings`, `unauthorized`, `source_unreachable`, `not_found`, `unavailable`.
        message:
          type: string
          description: What the administrator reads.
