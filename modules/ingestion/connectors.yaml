# Connectors the ingestion worker runs (docs/operations/connectors.md). Restart
# the worker after changing this file. Example, the watched folder, which
# reads the files in ./watch (KNOWCEL_WATCH_DIR) as /watch:
#
# connectors:
#   - name: watch
#     kind: folder
#     owner: 3f5c6d3e-0000-0000-0000-000000000000   # id of a platform admin
#     public: true                                  # or team_ids: [<team id>]
#     interval_seconds: 60
#     settings:
#       path: /watch
#
# A connector that is only searched live, at question time (see "Live search"
# in docs/operations/connectors.md); everyone who may read it sees what its
# search returns, so enable it only for sources where that is fine:
#
#   - name: stock
#     kind: folder
#     owner: 3f5c6d3e-0000-0000-0000-000000000000
#     public: true
#     sync: false
#     live_search: true
#     settings:
#       path: /watch
connectors: []
