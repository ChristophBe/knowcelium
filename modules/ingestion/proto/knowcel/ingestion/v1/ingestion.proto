syntax = "proto3";

package knowcel.ingestion.v1;

import "google/protobuf/timestamp.proto";
import "knowcel/common/v1/common.proto";

option go_package = "github.com/ChristophBe/knowcelium/modules/ingestion/api/go/ingestionv1;ingestionv1";

// IngestionService accepts new content and tracks it through processing
// (extraction, chunking, embedding).
service IngestionService {
  // CreateUpload registers an ingestion job and returns a presigned URL the
  // client uploads the file to. A file the document module does not accept
  // (empty, too large, of a type it does not take) is rejected with field
  // violations.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
  // CompleteUpload confirms the upload finished and queues processing. A
  // file the document module rejects once uploaded (too large, not matching
  // its sha256) fails the job instead, with the reason in error.
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  // ReplaceUpload starts uploading a new version of an existing document,
  // which keeps its id, title and metadata. The document's job waits for the
  // file again as a new run (filename and content_type become the new file's);
  // CompleteUpload then queues it, and once processed the new version
  // replaces the document's file and chunks. Until then the document keeps
  // its current version, and keeps it when the new one fails. A file the
  // document module does not accept is rejected with field violations; a
  // document whose job is QUEUED or PROCESSING, or that is still being
  // uploaded or processed, fails with FAILED_PRECONDITION (reason
  // DOCUMENT_BUSY); another user's document is NOT_FOUND.
  rpc ReplaceUpload(ReplaceUploadRequest) returns (ReplaceUploadResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // WatchJob streams the job every time it changes until it is terminal.
  rpc WatchJob(WatchJobRequest) returns (stream WatchJobResponse);
  // ReprocessJob queues a FAILED or DONE job again: the worker extracts,
  // chunks and embeds the uploaded file anew and replaces the document's
  // chunks. Other jobs fail with FAILED_PRECONDITION.
  rpc ReprocessJob(ReprocessJobRequest) returns (ReprocessJobResponse);
  // ListConnectors returns every configured connector with its health.
  // Platform admins only (PERMISSION_DENIED otherwise; UNAVAILABLE while iam,
  // which tells who is one, is down).
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);
  // GetConnector returns one connector by id (NOT_FOUND when none is
  // configured under it). Platform admins only, like ListConnectors.
  rpc GetConnector(GetConnectorRequest) returns (GetConnectorResponse);
  // SearchConnectors asks the connectors that allow live search for passages
  // matching a query, at question time and without copying their content into
  // documents. Only connectors the caller may read are asked: public ones and
  // those shared with one of the caller's teams. Connectors are asked
  // concurrently; one that fails or does not answer in time is left out and
  // named in unavailable_connectors, the others still answer. UNAVAILABLE when
  // the connector runtime (the ingestion worker) is not running, which callers
  // treat as "no connector snippets".
  rpc SearchConnectors(SearchConnectorsRequest) returns (SearchConnectorsResponse);
}

// Access says who can read a document, as in the document module.
enum Access {
  // Treated as ACCESS_PUBLIC.
  ACCESS_UNSPECIFIED = 0;
  // Every signed-in user can read the document.
  ACCESS_PUBLIC = 1;
  // Its owner and the members of its teams can read the document.
  ACCESS_TEAM = 2;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING_UPLOAD = 1;
  JOB_STATUS_QUEUED = 2;
  JOB_STATUS_PROCESSING = 3;
  JOB_STATUS_DONE = 4;
  JOB_STATUS_FAILED = 5;
}

// JobStage is the step of processing a job is in. Stages run in this order.
enum JobStage {
  JOB_STAGE_UNSPECIFIED = 0;
  // Reading the uploaded file and extracting its text.
  JOB_STAGE_EXTRACTING = 1;
  // Splitting the text into chunks.
  JOB_STAGE_CHUNKING = 2;
  // Computing the chunks' embeddings, the longest stage.
  JOB_STAGE_EMBEDDING = 3;
  // Storing the embedded chunks in the document module.
  JOB_STAGE_STORING = 4;
}

message Job {
  string id = 1;
  string document_id = 2;
  string filename = 3;
  string content_type = 4;
  JobStatus status = 5;
  string error = 6;
  int32 chunk_count = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
  // Estimated share of the current run that is done, 0–100. It only grows
  // within a run, is 100 once the job is DONE and starts over at 0 when the
  // job is reprocessed.
  int32 progress = 10;
  // The step the current run reached; UNSPECIFIED until the worker reports one.
  JobStage stage = 11;
  // The user who created the upload, as the subject of their token. Set by
  // the service; only this user can see the job.
  string owner_id = 12;
}

message CreateUploadRequest {
  string filename = 1;
  string content_type = 2;
  // The file's size; must be greater than 0, empty files are rejected.
  int64 size_bytes = 3;
  // Defaults to the filename when empty.
  string title = 4;
  // Optional SHA-256 of the file, in hex. A file uploaded with other content
  // fails its job on CompleteUpload.
  string sha256 = 5;
  // Who can read the document; unset means ACCESS_PUBLIC. Changeable later
  // in the document module.
  Access access = 7;
  // The teams of an ACCESS_TEAM document, at least one, which the caller must
  // belong to; a team the caller is not in fails with NOT_FOUND (reason
  // TEAM_NOT_FOUND). A public document takes none (INVALID_ARGUMENT).
  repeated string team_ids = 6;
}

message CreateUploadResponse {
  Job job = 1;
  // A presigned URL to PUT the file to, sending the job's content_type as
  // Content-Type and exactly size_bytes bytes; other uploads are refused.
  string upload_url = 2;
}

message ReplaceUploadRequest {
  string document_id = 1;
  string filename = 2;
  string content_type = 3;
  // The new file's size; must be greater than 0.
  int64 size_bytes = 4;
  // Optional SHA-256 of the new file, in hex, checked like CreateUpload's.
  string sha256 = 5;
}

message ReplaceUploadResponse {
  Job job = 1;
  // A presigned URL to PUT the new file to, sending the job's content_type as
  // Content-Type and exactly size_bytes bytes.
  string upload_url = 2;
}

message CompleteUploadRequest {
  string job_id = 1;
}

message CompleteUploadResponse {
  Job job = 1;
}

message GetJobRequest {
  string id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  knowcel.common.v1.PageRequest page = 1;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  knowcel.common.v1.PageResponse page = 2;
}

message WatchJobRequest {
  string id = 1;
}

message WatchJobResponse {
  Job job = 1;
}

message ReprocessJobRequest {
  string id = 1;
}

message ReprocessJobResponse {
  Job job = 1;
}

// ConnectorHealth says whether a connector keeps its documents up to date. It
// is derived when the connector is read, from its last sync and its interval.
enum ConnectorHealth {
  CONNECTOR_HEALTH_UNSPECIFIED = 0;
  // The last sync succeeded, within the expected interval.
  CONNECTOR_HEALTH_HEALTHY = 1;
  // The last sync had partial failures: some items synced, others did not.
  CONNECTOR_HEALTH_DEGRADED = 2;
  // The last sync failed.
  CONNECTOR_HEALTH_FAILING = 3;
  // The last sync ended more than twice the connector's interval ago,
  // whatever its outcome: syncs have stopped (the worker is down or stuck).
  CONNECTOR_HEALTH_STALE = 4;
  // The connector has not synced yet.
  CONNECTOR_HEALTH_UNKNOWN = 5;
}

// Connector is an external system whose content is synced into documents on a
// schedule (see docs/operations/connectors.md). Connectors are configured in
// the worker's connectors file; this is what the worker reported about them.
message Connector {
  // The connector's configured name, which is unique and does not change.
  string id = 1;
  string name = 2;
  // The kind of source (for example "folder"); empty when the connector's
  // configuration is invalid.
  string kind = 3;
  bool enabled = 4;
  ConnectorHealth health = 5;
  // Seconds between the starts of two syncs, 0 when the configuration is
  // invalid.
  int32 interval_seconds = 6;
  // Start and end of the last sync, unset until one ran.
  google.protobuf.Timestamp last_sync_start_time = 7;
  google.protobuf.Timestamp last_sync_end_time = 8;
  // End of the last successful sync, unset until one succeeded.
  google.protobuf.Timestamp last_success_time = 9;
  // Documents the connector keeps in sync, as of its last sync.
  int32 documents_synced = 10;
  // Why the last sync failed, or a note about it (items skipped); empty when
  // it went through cleanly.
  string last_error = 11;
}

message ListConnectorsRequest {}

message ListConnectorsResponse {
  // Ordered by name.
  repeated Connector connectors = 1;
}

message GetConnectorRequest {
  string id = 1;
}

message GetConnectorResponse {
  Connector connector = 1;
}

message SearchConnectorsRequest {
  // The question or search words; required.
  string query = 1;
  // Only these connectors (their names in the connectors file); empty asks all
  // the caller may read. A name the caller may not read or that does not allow
  // live search is ignored.
  repeated string connector_ids = 2;
  // The most snippets to return in total, 1 to 20; 0 means 5. Each connector
  // is asked for this many and the results are interleaved.
  int32 limit = 3;
  // Only connectors shared with one of these teams (public ones are not
  // asked); teams the caller does not belong to are ignored, and with none
  // left nothing is searched. Empty means every connector the caller may read,
  // public ones included.
  repeated string team_ids = 4;
}

message SearchConnectorsResponse {
  repeated ConnectorSnippet snippets = 1;
  // The connectors that failed or did not answer in time, by name.
  repeated string unavailable_connectors = 2;
  // Every connector that was asked, by name, including those that failed or
  // found nothing.
  repeated string searched_connectors = 3;
}

// A passage a connector found when searched live.
message ConnectorSnippet {
  // The name of the connector, as in the connectors file.
  string connector = 1;
  string title = 2;
  string text = 3;
  // Where to open the original.
  string source_url = 4;
  // The item's id in the source system, when the connector gives one.
  string external_id = 5;
}
