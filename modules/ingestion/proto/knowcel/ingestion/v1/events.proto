syntax = "proto3";

package knowcel.ingestion.v1;

import "google/protobuf/timestamp.proto";
import "knowcel/ingestion/v1/ingestion.proto";

option go_package = "github.com/ChristophBe/knowcelium/modules/ingestion/api/go/ingestionv1;ingestionv1";

// Events published on NATS JetStream stream "INGESTION". The subject for each
// message is noted on the message. Payloads are binary-encoded protobuf.
//
// run counts the processing runs of a job: 1 for the upload, incremented by
// every ReprocessJob and ReplaceUpload. The worker copies it from DocumentUploaded to the events
// it publishes, so events of an earlier run are ignored and message ids stay
// unique per run. 0 (events from before runs existed) means run 1.

// Subject: knowcel.ingestion.uploaded
message DocumentUploaded {
  string job_id = 1;
  string document_id = 2;
  string filename = 3;
  string content_type = 4;
  int32 run = 5;
  // The teams the document was shared with at upload, for consumers that
  // want them without asking the document module. Later changes to the
  // sharing are not reflected; only the document module knows the current ones.
  repeated string team_ids = 6;
}

// Subject: knowcel.ingestion.started
message ProcessingStarted {
  string job_id = 1;
  string document_id = 2;
  int32 run = 3;
}

// Subject: knowcel.ingestion.progress
// Published while a job is processed: when a stage starts and after every
// embedding batch. Best effort: a lost event only delays the next update.
message ProcessingProgress {
  string job_id = 1;
  string document_id = 2;
  int32 run = 3;
  JobStage stage = 4;
  // 0–100, see Job.progress.
  int32 progress = 5;
}

// Subject: knowcel.ingestion.processed
message DocumentProcessed {
  string job_id = 1;
  string document_id = 2;
  int32 chunk_count = 3;
  int32 run = 4;
  // The user who owns the document (Document.owner_id), for consumers that
  // read documents on the owner's behalf. Empty for events from before it was
  // set.
  string owner_id = 5;
}

// Subject: knowcel.ingestion.failed
message ProcessingFailed {
  string job_id = 1;
  string document_id = 2;
  string error = 3;
  int32 run = 4;
}

// SyncOutcome is how a connector's sync run ended.
enum SyncOutcome {
  SYNC_OUTCOME_UNSPECIFIED = 0;
  // Every item synced (items skipped as empty do not count as failures).
  SYNC_OUTCOME_SUCCEEDED = 1;
  // Some items synced, others failed.
  SYNC_OUTCOME_PARTIAL = 2;
  // The run failed as a whole (bad settings, source unreachable) or no item
  // synced.
  SYNC_OUTCOME_FAILED = 3;
}

// Subject: knowcel.ingestion.connector_synced
// Published by the worker after each sync run of a connector, for the
// connector status of the ingestion service (ListConnectors). The service
// keeps the newest report per connector (by end_time); a lost report only
// delays the status until the next run. It carries the connector's
// configuration too, so that a connector appears even when
// ConnectorsConfigured was lost.
message ConnectorSynced {
  // The connector's configured name.
  string name = 1;
  SyncOutcome outcome = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  // Documents the connector keeps in sync after the run; unset when the
  // worker could not tell (its state store failed), which keeps the last count.
  optional int32 documents = 5;
  // Why the run failed, or a note about it; empty for a clean run.
  string error = 6;
  string kind = 7;
  bool enabled = 8;
  // Seconds between syncs.
  int32 interval_seconds = 9;
}

// ConnectorConfig is one entry of the connectors file.
message ConnectorConfig {
  // The connector's name; "#<position>" for an entry that has none.
  string name = 1;
  // Empty when the entry is invalid.
  string kind = 2;
  bool enabled = 3;
  // Seconds between syncs, 0 when the entry is invalid.
  int32 interval_seconds = 4;
  // What is wrong with the entry; empty when it is valid. The connector then
  // reports FAILING with this message.
  string error = 5;
}

// Subject: knowcel.ingestion.connectors_configured
// Published by the worker at start and every few minutes after, with every
// entry of its connectors file (an empty list when it has none). The service
// adds the connectors it does not know, updates the others' configuration and
// forgets the ones no longer listed, so that a removed connector disappears
// and a connector that never synced is UNKNOWN.
message ConnectorsConfigured {
  repeated ConnectorConfig connectors = 1;
  google.protobuf.Timestamp time = 2;
}

// Request/reply, not events: the ingestion service asks the worker's connector
// runtime for live search results with a core NATS request on subject
// knowcel.connectors.search (outside the INGESTION stream, which would
// acknowledge the request instead of the worker). Workers share the queue
// group "ingestion-worker". See docs/adr/0015-live-retrieval-through-connectors.md.
message ConnectorSearchRequest {
  string query = 1;
  repeated string connector_ids = 2;
  int32 limit = 3;
  // Connectors shared with none of these teams are not asked, unless public.
  // The service fills it from the caller's teams in iam.
  repeated string member_team_ids = 4;
  // When not empty, only connectors shared with one of these teams (and no
  // public ones) are asked: the teams a conversation is limited to.
  repeated string scope_team_ids = 5;
  // Seconds a connector gets to answer before it counts as unavailable.
  float timeout_seconds = 6;
}

message ConnectorSearchReply {
  repeated ConnectorSnippet snippets = 1;
  repeated string unavailable_connectors = 2;
}
